name: Daily Stock Scan

on:
  schedule:
    # Runs Monday to Friday at 11:15 AM UTC (4:45 PM IST)
    - cron: '15 11 * * 1-5'
  workflow_dispatch: # Allows manual trigger

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scan Script
      env:
        NVIDIA_AI_API_KEY: ${{ secrets.NVIDIA_AI_API_KEY }}
        ANGEL_ONE_CLIENT_ID: ${{ secrets.ANGEL_ONE_CLIENT_ID }}
        ANGEL_ONE_PASSWORD: ${{ secrets.ANGEL_ONE_PASSWORD }}
        ANGEL_ONE_API_KEY: ${{ secrets.ANGEL_ONE_API_KEY }}
        ANGEL_ONE_TOTP_KEY: ${{ secrets.ANGEL_ONE_TOTP_KEY }}
      run: |
        python run_cli_scan.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add suggestions_db.json scan_history.json yf_cache.pkl || true
        git commit -m "chore: auto-update suggestions database [skip ci]" || true
        git push origin main || true

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        cname: ''
